<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Spank Master CPS - Mega Spank Cinematic</title>
  <style>
    :root {
      --bg-dark: #0f0c1b;
      --card-bg: rgba(26, 22, 45, 0.85);
      --accent-pink: #ff2a85;
      --accent-purple: #9d4edd;
      --accent-cyan: #00f0ff;
      --accent-gold: #ffd60a;
      --accent-fire: #ff4500;
      --text-main: #f8f9fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, #25163f, var(--bg-dark));
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      padding: 16px;
      position: relative;
    }

    /* Screen Shake on Mega Spank */
    body.camera-shake {
      animation: screenRumble 0.5s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes screenRumble {
      10%, 90% { transform: translate3d(-3px, 2px, 0); }
      20%, 80% { transform: translate3d(5px, -4px, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 6px, 0); }
      40%, 60% { transform: translate3d(6px, -5px, 0); }
    }

    /* Screen Flash Overlay */
    #screenFlash {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, #ffffff 15%, #ff7700 70%, transparent 100%);
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      transition: opacity 0.35s ease-out;
    }

    #screenFlash.flashing {
      opacity: 0.95;
      transition: none;
    }

    header {
      text-align: center;
      margin-top: 6px;
    }

    h1 {
      font-size: 2.1rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(90deg, var(--accent-pink), var(--accent-gold), var(--accent-fire));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(255, 69, 0, 0.4);
    }

    .subtitle {
      font-size: 0.9rem;
      color: #a09cb0;
      margin-top: 4px;
    }

    /* Stats Dashboard */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 600px;
      margin: 14px 0;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 10px 6px;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }

    .stat-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-pink), var(--accent-purple));
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #9d96b8;
      font-weight: 700;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 800;
      margin-top: 2px;
      color: #fff;
    }

    .stat-value.highlight {
      color: var(--accent-gold);
    }

    /* Target Area */
    .arena {
      position: relative;
      width: 100%;
      max-width: 400px;
      height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto 0;
      overflow: visible;
    }

    .target-wrapper {
      position: relative;
      cursor: pointer;
      transform-origin: center bottom;
      transition: transform 0.05s ease;
      z-index: 5;
    }

    .target-wrapper:active {
      transform: scale(0.96);
    }

    /* Normal Slap Hand Click Burst */
    .hand-burst {
      position: absolute;
      pointer-events: none;
      width: 105px;
      height: 105px;
      z-index: 25;
      opacity: 0;
      animation: handBurstAnim 0.32s ease-out forwards;
      filter: drop-shadow(0 0 12px var(--accent-pink));
    }

    @keyframes handBurstAnim {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.8) rotate(var(--hand-rot, 0deg));
      }
      35% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.15) rotate(var(--hand-rot, 0deg)) translate(-6px, 6px);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.5) rotate(var(--hand-rot, 0deg)) translate(0px, -20px);
      }
    }

    /* Floating Popups */
    .float-text {
      position: absolute;
      font-weight: 900;
      font-size: 1.3rem;
      pointer-events: none;
      animation: floatUp 0.65s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
      z-index: 30;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translate(-50%, 0) scale(0.8) rotate(var(--rot, 0deg));
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -90px) scale(1.4) rotate(var(--rot, 0deg));
      }
    }

    /* Standard Wobble */
    .jiggle-left { animation: jiggleL 0.2s ease-out; }
    .jiggle-right { animation: jiggleR 0.2s ease-out; }

    @keyframes jiggleL {
      0% { transform: scale(1, 1); }
      30% { transform: scale(1.18, 0.86) rotate(-5deg) translate(-8px, 4px); }
      60% { transform: scale(0.92, 1.08) rotate(3deg) translate(4px, -2px); }
      100% { transform: scale(1, 1) rotate(0deg); }
    }

    @keyframes jiggleR {
      0% { transform: scale(1, 1); }
      30% { transform: scale(1.18, 0.86) rotate(5deg) translate(8px, 4px); }
      60% { transform: scale(0.92, 1.08) rotate(-3deg) translate(-4px, -2px); }
      100% { transform: scale(1, 1) rotate(0deg); }
    }

    /* ============================================================
       CINEMATIC SLOW MEGA SPANK ANIMATIONS
    ============================================================ */
    .mega-hand-container {
      position: absolute;
      top: -380px;
      right: -320px;
      width: 330px;
      height: 330px;
      pointer-events: none;
      z-index: 80;
      opacity: 0;
      filter: drop-shadow(0 0 25px #ff2a00) drop-shadow(0 0 55px #ff9900) drop-shadow(0 0 100px #ff0055);
      transform-origin: center center;
    }

    /* Extended 1.15s cinematic strike with dramatic windup and snap */
    .mega-hand-strike {
      animation: cinematicMegaStrike 1.15s cubic-bezier(0.25, 1, 0.3, 1) forwards;
    }

    @keyframes cinematicMegaStrike {
      0% {
        opacity: 0;
        transform: translate(280px, -280px) rotate(65deg) scale(3.2);
      }
      25% {
        opacity: 1;
        /* Sweeping down from the clouds */
        transform: translate(130px, -130px) rotate(42deg) scale(2.4);
      }
      65% {
        /* Dramatic anticipation hang: looms directly above before the slam */
        opacity: 1;
        transform: translate(25px, -15px) rotate(22deg) scale(1.9);
      }
      78% {
        /* HEAVY SLAM CONTACT */
        opacity: 1;
        transform: translate(-170px, 145px) rotate(-14deg) scale(1.4);
      }
      88% {
        /* Follow-through */
        opacity: 1;
        transform: translate(-195px, 165px) rotate(-20deg) scale(1.25);
      }
      100% {
        opacity: 0;
        transform: translate(-240px, 195px) rotate(-25deg) scale(1.05);
      }
    }

    /* Slow-Motion Shattered Shards (1.4s duration) */
    .shattered-shard {
      position: absolute;
      pointer-events: none;
      z-index: 40;
      animation: slowShardFly 1.4s cubic-bezier(0.12, 0.85, 0.28, 1) forwards;
    }

    @keyframes slowShardFly {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1.3) rotate(0deg);
      }
      50% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(var(--dest-x), var(--dest-y)) scale(0.1) rotate(var(--dest-rot));
      }
    }

    /* Exaggerated Bouncy Drop-In from the Sky (0.95s) */
    .target-drop-in {
      animation: slowDropFromSky 0.95s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes slowDropFromSky {
      0% {
        opacity: 0;
        transform: translateY(-500px) scale(0.5, 1.7);
      }
      55% {
        opacity: 1;
        /* Deep squish upon hitting the floor */
        transform: translateY(28px) scale(1.45, 0.55);
      }
      72% {
        /* Bouncing back up */
        transform: translateY(-16px) scale(0.9, 1.15);
      }
      88% {
        /* Soft secondary bounce */
        transform: translateY(6px) scale(1.06, 0.95);
      }
      100% {
        opacity: 1;
        transform: translateY(0px) scale(1, 1);
      }
    }

    /* Mega Spank Banner */
    .mega-banner {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.4);
      font-size: 2.2rem;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-align: center;
      background: linear-gradient(180deg, #ffe600, #ff0055);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 35px rgba(255, 69, 0, 0.95);
      pointer-events: none;
      z-index: 90;
      opacity: 0;
      white-space: nowrap;
    }

    .mega-banner.show {
      animation: bannerPopup 1.8s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }

    @keyframes bannerPopup {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.3) rotate(-8deg);
      }
      20% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.2) rotate(3deg);
      }
      40% {
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
      }
      80% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.05);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -90px) scale(0.7);
      }
    }

    /* Streak & Combo Meter */
    .combo-bar-container {
      width: 100%;
      max-width: 420px;
      margin-bottom: 12px;
    }

    .combo-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .combo-rank {
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .combo-track {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .combo-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent-purple), var(--accent-pink), var(--accent-gold));
      box-shadow: 0 0 10px var(--accent-pink);
      transition: width 0.08s linear;
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 10px;
      margin-top: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.5px;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    .btn-test {
      background: linear-gradient(90deg, #ff4500, #ff2a85);
      border-color: #ffd60a;
      box-shadow: 0 0 12px rgba(255, 69, 0, 0.4);
    }

    .btn-test:hover {
      background: linear-gradient(90deg, #ff5714, #ff4095);
      box-shadow: 0 0 18px rgba(255, 69, 0, 0.7);
    }

    @media (max-width: 480px) {
      .dashboard { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      h1 { font-size: 1.6rem; }
      .arena { height: 300px; }
      .mega-banner { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

  <!-- Screen Flash -->
  <div id="screenFlash"></div>

  <header>
    <h1>Spank Master CPS</h1>
    <div class="subtitle">Reach a 250-streak for the fiery MEGA SPANK!</div>
  </header>

  <!-- Metrics -->
  <div class="dashboard">
    <div class="stat-card">
      <div class="stat-label">Total Score</div>
      <div class="stat-value" id="val-score">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">SPS (CPS)</div>
      <div class="stat-value highlight" id="val-cps">0.0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Current Streak</div>
      <div class="stat-value" id="val-streak">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Best Streak</div>
      <div class="stat-value highlight" id="val-high-streak">0</div>
    </div>
  </div>

  <!-- Arena -->
  <div class="arena" id="arena">
    <!-- Target Container -->
    <div class="target-wrapper" id="target">
      <svg width="260" height="240" viewBox="0 0 260 240" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="buttGrad" cx="50%" cy="40%" r="65%">
            <stop offset="0%" stop-color="#ff9ebb" />
            <stop offset="55%" stop-color="#ff4d79" />
            <stop offset="100%" stop-color="#c9184a" />
          </radialGradient>
          <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ff2a85" flood-opacity="0.35"/>
          </filter>
        </defs>

        <g filter="url(#softGlow)">
          <!-- Left Cheek -->
          <path d="M 130 50 C 90 20, 20 50, 20 120 C 20 185, 75 225, 128 220 C 130 180, 130 110, 130 50 Z" 
                fill="url(#buttGrad)" stroke="#590d22" stroke-width="4" stroke-linejoin="round" />
          <!-- Right Cheek -->
          <path d="M 130 50 C 170 20, 240 50, 240 120 C 240 185, 185 225, 132 220 C 130 180, 130 110, 130 50 Z" 
                fill="url(#buttGrad)" stroke="#590d22" stroke-width="4" stroke-linejoin="round" />
          <!-- Center Crease Highlight -->
          <path d="M 130 75 C 130 125, 130 175, 130 215" stroke="#590d22" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
          <!-- Specular Highlights -->
          <ellipse cx="75" cy="115" rx="30" ry="18" transform="rotate(-30 75 115)" fill="#ffffff" opacity="0.32" />
          <ellipse cx="185" cy="115" rx="30" ry="18" transform="rotate(30 185 115)" fill="#ffffff" opacity="0.32" />
          <!-- Waistband Accent -->
          <path d="M 40 70 C 95 90, 165 90, 220 70" stroke="#ffd60a" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
        </g>
      </svg>
    </div>

    <!-- Mega Hand with Fiery Aura -->
    <div class="mega-hand-container" id="megaHandContainer">
      <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:100%;">
        <defs>
          <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="25%" stop-color="#ffee55" />
            <stop offset="60%" stop-color="#ff4400" />
            <stop offset="100%" stop-color="#880000" />
          </linearGradient>
        </defs>

        <!-- Outer Flame Aura Spikes -->
        <path d="M 40 140 C 15 120, -10 80, 10 50 C 20 70, 30 70, 35 40 C 45 65, 55 50, 60 25 C 75 55, 85 45, 95 15 C 110 50, 125 40, 135 25 C 145 55, 165 60, 185 40 C 180 75, 195 95, 175 130 C 190 150, 180 180, 150 185 C 130 190, 70 190, 40 140 Z" 
              fill="url(#fireGrad)" opacity="0.85" />

        <!-- Fiery Slapping Palm -->
        <path d="M 50 135 C 35 120, 35 90, 60 75 C 70 68, 85 72, 90 82 C 93 66, 112 66, 117 80 C 123 68, 140 74, 140 89 C 146 80, 158 89, 154 107 C 146 142, 105 165, 75 158 Z" 
              fill="#ffe8a3" stroke="#d84a00" stroke-width="5" stroke-linejoin="round"/>
        <!-- Palm Creases -->
        <path d="M 68 100 L 71 130 M 90 95 L 92 130 M 114 100 L 112 130" stroke="#d84a00" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- Mega Spank Banner Announcement -->
    <div class="mega-banner" id="megaBanner">💥 250 STREAK MEGA SPANK! 💥</div>
  </div>

  <!-- Combo Meter -->
  <div class="combo-bar-container">
    <div class="combo-header">
      <span class="combo-rank" id="comboRank">Cold Warmup</span>
      <span id="multiplierText">1.0x Multiplier</span>
    </div>
    <div class="combo-track">
      <div class="combo-fill" id="comboFill"></div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button id="btnSound">🔊 Sound: ON</button>
    <button id="btnTestMega" class="btn-test">🔥 Test Mega Spank</button>
    <button id="btnReset">🔄 Reset Scores</button>
  </div>

  <script>
    /* -------------------------------------------------------------
       STATE & CONSTANTS
    ------------------------------------------------------------- */
    let score = 0;
    let streak = 0;
    let highStreak = parseInt(localStorage.getItem('booty_high_streak') || '0', 10);
    let highScore = parseInt(localStorage.getItem('booty_high_score') || '0', 10);
    let soundEnabled = true;
    let isMegaSpankActive = false;

    let clickTimestamps = [];
    const STREAK_TIMEOUT_MS = 1400;
    let streakDecayTimer = null;
    let lastClickSide = 'left';

    // DOM Elements
    const valScore = document.getElementById('val-score');
    const valCps = document.getElementById('val-cps');
    const valStreak = document.getElementById('val-streak');
    const valHighStreak = document.getElementById('val-high-streak');
    const comboFill = document.getElementById('comboFill');
    const comboRank = document.getElementById('comboRank');
    const multiplierText = document.getElementById('multiplierText');
    const target = document.getElementById('target');
    const arena = document.getElementById('arena');
    const screenFlash = document.getElementById('screenFlash');
    const megaHandContainer = document.getElementById('megaHandContainer');
    const megaBanner = document.getElementById('megaBanner');
    const btnSound = document.getElementById('btnSound');
    const btnTestMega = document.getElementById('btnTestMega');
    const btnReset = document.getElementById('btnReset');

    valHighStreak.textContent = highStreak;

    /* -------------------------------------------------------------
       AUDIO SYNTHESIZER
    ------------------------------------------------------------- */
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSlapSound(isCombo = false) {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;

      // Noise burst
      const bufferSize = audioCtx.sampleRate * 0.04;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = noiseBuffer;
      const noiseFilter = audioCtx.createBiquadFilter();
      noiseFilter.type = 'highpass';
      noiseFilter.frequency.setValueAtTime(800, now);

      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.4, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

      whiteNoise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(audioCtx.destination);
      whiteNoise.start(now);

      // Low punch
      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(isCombo ? 180 : 130, now);
      osc.frequency.exponentialRampToValueAtTime(35, now + 0.1);

      oscGain.gain.setValueAtTime(0.6, now);
      oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

      osc.connect(oscGain);
      oscGain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.11);
    }

    // Fiery Mega Spank Explosion Sound with Deep Sub Rumble
    function playMegaExplosionSound() {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;

      // 1. Long rumble explosion noise
      const bufferSize = audioCtx.sampleRate * 0.9;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

      const noise = audioCtx.createBufferSource();
      noise.buffer = noiseBuffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1400, now);
      filter.frequency.linearRampToValueAtTime(70, now + 0.9);

      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(1.0, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.9);

      noise.connect(filter);
      filter.connect(noiseGain);
      noiseGain.connect(audioCtx.destination);
      noise.start(now);

      // 2. Sub-bass ground slam
      const subOsc = audioCtx.createOscillator();
      const subGain = audioCtx.createGain();
      subOsc.type = 'sine';
      subOsc.frequency.setValueAtTime(170, now);
      subOsc.frequency.exponentialRampToValueAtTime(20, now + 0.7);

      subGain.gain.setValueAtTime(1.0, now);
      subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);

      subOsc.connect(subGain);
      subGain.connect(audioCtx.destination);
      subOsc.start(now);
      subOsc.stop(now + 0.72);
    }

    /* -------------------------------------------------------------
       CPS & COMBO LOGIC
    ------------------------------------------------------------- */
    function updateCPS() {
      const now = performance.now();
      clickTimestamps = clickTimestamps.filter(t => now - t <= 1000);
      valCps.textContent = clickTimestamps.length.toFixed(1);
    }
    setInterval(updateCPS, 100);

    function getMultiplier() {
      if (streak >= 250) return 6.0;
      if (streak >= 100) return 4.0;
      if (streak >= 50)  return 3.0;
      if (streak >= 25)  return 2.0;
      if (streak >= 10)  return 1.5;
      return 1.0;
    }

    function getRankName() {
      if (streak >= 250) return '🔥 FIERY GOD OF SPANK!';
      if (streak >= 100) return '⚡ Thunder Slapper!';
      if (streak >= 50)  return '💨 Speed Demon!';
      if (streak >= 25)  return '✨ Spicy Streak!';
      if (streak >= 10)  return 'Warmup';
      return 'Cold Warmup';
    }

    function resetStreakDecay() {
      // Don't expire the streak while the cinematic is running!
      if (isMegaSpankActive) return;

      clearTimeout(streakDecayTimer);
      comboFill.style.transition = 'none';
      comboFill.style.width = '100%';

      requestAnimationFrame(() => {
        comboFill.style.transition = `width ${STREAK_TIMEOUT_MS}ms linear`;
        comboFill.style.width = '0%';
      });

      streakDecayTimer = setTimeout(() => {
        if (!isMegaSpankActive) {
          streak = 0;
          updateUI();
        }
      }, STREAK_TIMEOUT_MS);
    }

    function updateUI() {
      valScore.textContent = score;
      valStreak.textContent = streak;
      valHighStreak.textContent = highStreak;

      const mult = getMultiplier();
      multiplierText.textContent = `${mult.toFixed(1)}x Multiplier`;
      comboRank.textContent = getRankName();

      if (streak === 0) {
        comboFill.style.width = '0%';
      }
    }

    /* -------------------------------------------------------------
       REGULAR HIT EFFECTS
    ------------------------------------------------------------- */
    const COMIC_PHRASES = ['SLAP!', 'SMACK!', 'POW!', 'CLAP!', 'THWACK!', 'BAM!'];

    function createHitEffect(x, y, mult) {
      const floatEl = document.createElement('div');
      floatEl.className = 'float-text';
      const phrase = COMIC_PHRASES[Math.floor(Math.random() * COMIC_PHRASES.length)];
      floatEl.textContent = mult > 1 ? `${phrase} +${mult}` : phrase;
      floatEl.style.left = `${x}px`;
      floatEl.style.top = `${y}px`;

      const colors = ['#ffd60a', '#ff2a85', '#00f0ff', '#ff9ebb', '#ffffff'];
      floatEl.style.color = colors[Math.floor(Math.random() * colors.length)];
      floatEl.style.setProperty('--rot', `${(Math.random() - 0.5) * 36}deg`);

      arena.appendChild(floatEl);
      setTimeout(() => floatEl.remove(), 650);

      // Hand Burst Effect
      const burstHand = document.createElement('div');
      burstHand.className = 'hand-burst';
      burstHand.style.left = `${x}px`;
      burstHand.style.top = `${y}px`;
      burstHand.style.setProperty('--hand-rot', `${(Math.random() - 0.5) * 50}deg`);

      burstHand.innerHTML = `
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M 30 70 C 20 60, 20 40, 35 30 C 42 25, 52 28, 55 35 C 57 24, 70 24, 73 34 C 77 26, 88 30, 88 40 C 92 34, 100 40, 97 52 C 92 75, 65 90, 45 85 Z" 
                fill="#ffd166" stroke="#e09f3e" stroke-width="4" stroke-linejoin="round"/>
          <path d="M 40 45 L 42 65 M 55 42 L 56 65 M 70 45 L 69 65" stroke="#e09f3e" stroke-width="3" stroke-linecap="round"/>
        </svg>
      `;
      arena.appendChild(burstHand);
      setTimeout(() => burstHand.remove(), 320);
    }

    /* -------------------------------------------------------------
       SLOW CINEMATIC MEGA SPANK SEQUENCE
    ------------------------------------------------------------- */
    function triggerMegaSpank() {
      if (isMegaSpankActive) return;
      isMegaSpankActive = true;

      // Freeze combo decay bar so player keeps their streak
      clearTimeout(streakDecayTimer);
      comboFill.style.transition = 'none';
      comboFill.style.width = '100%';

      // 1. Launch Giant Fiery Hand Strike (slow dramatic 1.15s windup)
      megaHandContainer.classList.remove('mega-hand-strike');
      void megaHandContainer.offsetWidth;
      megaHandContainer.classList.add('mega-hand-strike');

      // 2. Exact moment of impact (at 880ms into the windup)
      setTimeout(() => {
        // Flash screen with radiant burst
        screenFlash.classList.add('flashing');
        setTimeout(() => screenFlash.classList.remove('flashing'), 280);

        // Heavy camera shake
        document.body.classList.remove('camera-shake');
        void document.body.offsetWidth;
        document.body.classList.add('camera-shake');

        // Explosive impact sound
        playMegaExplosionSound();

        // Banner Announcement
        megaBanner.textContent = `💥 ${streak || 250} STREAK MEGA SPANK! 💥`;
        megaBanner.classList.remove('show');
        void megaBanner.offsetWidth;
        megaBanner.classList.add('show');

        // Shatter target into pieces
        shatterBooty();

        // 3. Anticipation pause before the new target drops in (600ms after shatter)
        setTimeout(() => {
          dropNewBooty();

          // 4. Once new target finishes dropping and settling (~950ms), resume regular gameplay
          setTimeout(() => {
            isMegaSpankActive = false;
            resetStreakDecay();
          }, 950);

        }, 600);

      }, 880);
    }

    function shatterBooty() {
      // Hide original target
      target.style.opacity = '0';
      target.classList.remove('jiggle-left', 'jiggle-right', 'target-drop-in');

      const rect = target.getBoundingClientRect();
      const arenaRect = arena.getBoundingClientRect();
      const centerX = rect.left - arenaRect.left + rect.width / 2;
      const centerY = rect.top - arenaRect.top + rect.height / 2;

      // Generate 25 flying polygon shards with randomized spread
      const shardColors = ['#ff9ebb', '#ff4d79', '#c9184a', '#ffd60a', '#ffffff', '#ff5722'];
      for (let i = 0; i < 25; i++) {
        const shard = document.createElement('div');
        shard.className = 'shattered-shard';

        const size = Math.floor(Math.random() * 30) + 16;
        shard.style.width = `${size}px`;
        shard.style.height = `${size}px`;
        shard.style.left = `${centerX + (Math.random() - 0.5) * 80}px`;
        shard.style.top = `${centerY + (Math.random() - 0.5) * 80}px`;

        // Radial explosion vector with gravity
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * 260 + 100;
        const destX = Math.cos(angle) * dist;
        const destY = Math.sin(angle) * dist + 100; // gravity downward bias
        const rot = (Math.random() - 0.5) * 900;

        shard.style.setProperty('--dest-x', `${destX}px`);
        shard.style.setProperty('--dest-y', `${destY}px`);
        shard.style.setProperty('--dest-rot', `${rot}deg`);

        const color = shardColors[Math.floor(Math.random() * shardColors.length)];
        shard.innerHTML = `
          <svg viewBox="0 0 30 30" width="100%" height="100%">
            <polygon points="${Math.random()*10},${Math.random()*10} ${Math.random()*20+10},0 ${Math.random()*30},${Math.random()*20+10} 0,${Math.random()*20+10}" fill="${color}" stroke="#590d22" stroke-width="2.5"/>
          </svg>
        `;

        arena.appendChild(shard);
        setTimeout(() => shard.remove(), 1400);
      }
    }

    function dropNewBooty() {
      // Re-show target and play slow, bouncy cartoon drop
      target.style.opacity = '1';
      target.classList.remove('target-drop-in');
      void target.offsetWidth;
      target.classList.add('target-drop-in');
    }

    /* -------------------------------------------------------------
       CLICK / INTERACTION HANDLER
    ------------------------------------------------------------- */
    function handleSpank(e) {
      e.preventDefault();
      if (isMegaSpankActive) return; // Prevent spam clicks mid-cinematic

      clickTimestamps.push(performance.now());

      // Increment Streak & Score
      streak++;
      if (streak > highStreak) {
        highStreak = streak;
        localStorage.setItem('booty_high_streak', highStreak);
      }

      const mult = getMultiplier();
      score += Math.round(1 * mult);
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('booty_high_score', highScore);
      }

      // Check for 250 Mega Spank milestone
      if (streak > 0 && streak % 250 === 0) {
        triggerMegaSpank();
      } else {
        // Standard slapping feedback
        lastClickSide = lastClickSide === 'left' ? 'right' : 'left';
        target.classList.remove('jiggle-left', 'jiggle-right', 'target-drop-in');
        void target.offsetWidth;
        target.classList.add(lastClickSide === 'left' ? 'jiggle-left' : 'jiggle-right');

        playSlapSound(mult > 1.5);

        const rect = arena.getBoundingClientRect();
        let clientX = e.clientX;
        let clientY = e.clientY;

        if (e.touches && e.touches.length > 0) {
          clientX = e.touches[0].clientX;
          clientY = e.touches[0].clientY;
        } else if (!clientX) {
          clientX = rect.left + rect.width / 2;
          clientY = rect.top + rect.height / 2;
        }

        const x = clientX - rect.left;
        const y = clientY - rect.top;
        createHitEffect(x, y, mult);
      }

      resetStreakDecay();
      updateUI();
    }

    target.addEventListener('pointerdown', handleSpank);

    /* -------------------------------------------------------------
       SETTINGS & CONTROLS
    ------------------------------------------------------------- */
    btnSound.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      btnSound.textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
    });

    // Test button to view the cinematic immediately
    btnTestMega.addEventListener('click', () => {
      if (!isMegaSpankActive) {
        streak = Math.max(streak, 250);
        updateUI();
        triggerMegaSpank();
      }
    });

    btnReset.addEventListener('click', () => {
      if (confirm('Reset your high scores and streaks?')) {
        highStreak = 0;
        highScore = 0;
        score = 0;
        streak = 0;
        localStorage.removeItem('booty_high_streak');
        localStorage.removeItem('booty_high_score');
        updateUI();
      }
    });

    updateUI();
  </script>
</body>
</html>
